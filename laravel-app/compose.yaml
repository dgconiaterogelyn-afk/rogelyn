services:
  app:
    build: .
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: app_db
      DB_USERNAME: laravel
      DB_PASSWORD: localdevpassword
    volumes:
      - ./.env:/var/www/.env
      - laravel_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8002:80"
    volumes:
      - ./nginx-laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: localdevpassword
      MYSQL_ROOT_PASSWORD: localrootpassword
    volumes:
      - laravel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalrootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laravel_storage:
  laravel_mysql:

