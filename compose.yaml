services:
  react:
    build:
      context: ./react-app
    ports:
      - "8001:8001"
    volumes:
      - ./react-app:/app
      - /app/node_modules

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      PORT: "5001"
    ports:
      - "5001:5001"

  app:
    build:
      context: ./laravel-app
    env_file: ./laravel-app/.env
    environment:
      APP_URL: http://localhost:8083
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: app_db
      DB_USERNAME: laravel
      DB_PASSWORD: localdevpassword
      SESSION_DRIVER: file
    volumes:
      - ./laravel-app/.env:/var/www/.env
      - laravel_storage:/var/www/storage
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
      - "3001:80"
    volumes:
      - ./laravel-app/nginx-laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel-app/public:/var/www/public:ro
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    ports:
      - "8084:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: localdevpassword
      MYSQL_ROOT_PASSWORD: localrootpassword
    volumes:
      - laravel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalrootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laravel_storage:
  laravel_mysql:
